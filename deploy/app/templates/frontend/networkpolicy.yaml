apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-network-policy
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels:
      app: frontend

  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.service.targetPort }}

  egress:
    - to:
        # dns resolution -> allows egress traffic to coreDNS, running in kube-system namespace
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system

      ports:
        - protocol: UDP
          port: 53 # universal standard port for dns network traffic
        - protocol: TCP
          port: 53

    - to:
        # allow backend pods only
        - podSelector:
            matchLabels:
              app: backend

      ports:
        - protocol: TCP
          port: {{ .Values.backend.service.targetPort }}
