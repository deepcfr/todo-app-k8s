apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: todo-app-network-policy
  namespace: {{ .Values.global.namespace }}
spec:
  podSelector:
    matchLabels:
      app: database

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend

        # allow postgres-exporter to talk to db
        # for metrics collection
        - podSelector:
            matchLabels:
              app: postgres-exporter

      ports:
        - protocol: TCP
          port: 5432
