kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
        protocol: TCP
  - role: worker
  - role: worker
networking:
  disableDefaultCNI: true # CNI = container network interface
  podSubnet: 192.168.0.0/16
