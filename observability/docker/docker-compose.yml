services:
  prometheus:
    image: prom/prometheus:latest
    container_name: todo-prometheus

    ports:
      - "9090:9090"

    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: todo-grafana

    ports:
      - "3000:3000"

    depends_on:
      - prometheus
